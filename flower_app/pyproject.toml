[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fids-flower"
version = "0.1.0"
description = "Flower Deployment-Engine version of the federated IDS (CICIoT2023): real SuperLink + SuperNode processes"
dependencies = ["flwr==1.42.0"]   # plus the federated-ids package of the parent repository (editable install)

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.flwr.app]
publisher = "vinit-soni"

[tool.flwr.app.components]
serverapp = "fids_flower.server_app:app"
clientapp = "fids_flower.client_app:app"

# Defaults mirror configs/federated.yaml; override with: flwr run ... --run-config "key=value ..."
# Data come from `python -m federated_ids.federated.export_partitions` (task/partition/seed are fixed there).
[tool.flwr.app.config]
server-data-dir = "D:/federated-ids-work/flower_data/category_iid_s0"
out-dir = "C:/Users/06ven/Downloads/federated-ids/artifacts/runs"
run-name = "flower_category_iid_fedavg_s0"
n-clients = 10
num-server-rounds = 30
local-epochs = 1
learning-rate = 0.001
batch-size = 512
device = "cpu"             # cpu | cuda (each SuperNode's ClientApp process)
